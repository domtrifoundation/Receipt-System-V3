name: gRPC Compatibility Check

# Per new_grpc_endpoint.md itself: "never skippable via a label or
# override, given what a silent break here actually costs." This one
# is deliberately NOT scaffolded-pending-real-code the way the others
# are — buf breaking works against .proto files directly, which can
# exist and be meaningfully checked well before the Python service
# code behind them does.

on:
  pull_request:
    paths:
      - '**/*.proto'

jobs:
  check-grpc-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A breaking-change check needs something to break. Until the first .proto is
      # actually merged to main there is no baseline, and buf fails with
      # 'Module "path: "."" had no .proto files' — which reads as a compatibility failure
      # but is really "this is the first one." Detected explicitly rather than left to look
      # like a red X someone learns to ignore, since this check is specifically the one
      # new_grpc_endpoint.md says must never be skippable.
      - name: Does main have a .proto baseline to compare against?
        id: baseline
        run: |
          git fetch --no-tags --depth=1 origin main
          if git ls-tree -r --name-only origin/main | grep -q '\.proto$'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main contains no .proto files yet, so there is no baseline to \
            check against. Skipping the breaking-change comparison for this PR only — every \
            subsequent PR touching a .proto will have one and will be checked normally."
          fi

      - uses: bufbuild/buf-setup-action@v1
        if: steps.baseline.outputs.exists == 'true'

      - name: Check for breaking changes against the previous release
        if: steps.baseline.outputs.exists == 'true'
        uses: bufbuild/buf-breaking-action@v1
        with:
          against: 'https://github.com/${{ github.repository }}.git#branch=main'

      # Deliberately no `buf lint` step here yet. Adding one requires a `buf.yaml` and a
      # decision about which rule set applies — and buf's default PACKAGE_DIRECTORY_MATCH
      # expects `resibo/agent_control/v1/agent_control.proto`, which conflicts with this
      # project's own package-per-API layout that puts each API's .proto inside its own
      # package folder. That is a real convention choice for a human to make, not something
      # to settle by adding a config file that silently picks one. Tracked in
      # docs/PHASE_1_COMPLETE.md.
