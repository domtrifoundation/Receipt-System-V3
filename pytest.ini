[pytest]
testpaths = tests
pythonpath = .
markers =
    forward_compat: validated across every interpreter in the Forward-Compatibility Pattern's
        support matrix (docs/PRINCIPLES.md §3.3.1), not just the primary dev interpreter.
        Selected by `nox -s forward_compat` to run under 3.14 and 3.15 specifically — see
        noxfile.py and docs/MAINTENANCE.md's Forward-Compatibility Validation section.
        Apply this to a test if it touches FrozenDict's actual resolved type, a GIL-protected
        assumption, or asyncio behavior that differs across these versions — not to a test
        that merely imports something from a module that happens to also do those things.
