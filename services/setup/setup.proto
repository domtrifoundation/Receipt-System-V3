// Setup API gRPC surface (`v3-deepdive-11-setup-api.md` §9, corrected).
//
// **`RunWizard` is bidirectional streaming, not the server-streaming §9 originally sketched.**
// The sketch was `rpc RunWizard(WizardRequest) returns (stream WizardStep)` — one input
// message, then a one-way stream of steps. That shape cannot express the wizard's actual flow:
// each step (`docs/SETUP_WIZARD_SCRIPT.md`) needs the owner's answer before the next step can
// even be decided (which branch a use case takes, whether a skippable step's decline changes
// what comes next). `services/setup/wizard.py`'s own `WizardEngine.run()` is an async
// generator for exactly this reason — `yield` a prompt, `.asend()` an answer — and bidirectional
// streaming is the direct gRPC mapping of that same shape: one `WizardAnswerMessage` in, one
// `WizardStepMessage` out, repeated until the flow completes. This is a corrected sketch, not a
// guess — the same category of correction Execution Core's §7 retry sketch and Reconciliation's
// §4.1 VAT sketch already document for their own APIs, recorded here rather than silently fixed.
//
// Field-numbering discipline (`docs/templates/new_grpc_endpoint.md`): fields are only ever
// added, never removed or renumbered.
//
// Errors are data (`docs/PRINCIPLES.md` §4.1): every response carries an `error_code`/
// `error_detail` pair rather than relying on gRPC status codes for anything this API's own
// callers need to branch on.

syntax = "proto3";

package resibo.setup.v1;

service SetupService {
  // Unary — the static hardware profile (§5), produced once and cheap enough that no streaming
  // shape is warranted (§8.1: "a handful of calls, once, not a hot path").
  rpc DetectHardware(DetectHardwareRequest) returns (HardwareProfileResponse);

  // Bidirectional streaming — see this file's own header comment for why, over §9's original
  // server-streaming sketch.
  rpc RunWizard(stream WizardAnswerMessage) returns (stream WizardStepMessage);

  // Provisions every service venv in one clone (`docs/VENV_AND_IMPORTS.md`) — unary, since a
  // caller (Update API's own `release_manager.py`, or Setup's own finalize routine) wants the
  // whole `ProvisionReport` at once, not a live per-service progress stream.
  rpc ProvisionVenvs(ProvisionVenvsRequest) returns (ProvisionVenvsResponse);

  // Real install-config surface, added post-§9 for the TUI's own Settings screen
  // (`services/interface/tui/menu_data/settings.py`). `dev_mode` is read-only on the
  // wire — §4.1's own "not convertible on a live install" — `run_on_startup` is freely
  // re-toggleable. `install_root=""` (unknown — a dev checkout, not inside a real
  // release clone) reports `known=false` rather than fabricating a value.
  rpc GetDevMode(ConfigRequest) returns (DevModeResponse);
  rpc GetRunOnStartup(ConfigRequest) returns (RunOnStartupResponse);
  rpc SetRunOnStartup(SetRunOnStartupRequest) returns (RunOnStartupResponse);
}

message ConfigRequest {
  // Empty means "resolve from this running process's own file location"
  // (`common/install_paths.py`'s `resolve_install_root()`) -- a caller with its own
  // known install_root (e.g. a test, or a client running on the same host) may supply
  // it explicitly instead.
  string install_root = 1;
}

message DevModeResponse {
  bool dev_mode = 1;
  bool known = 2;   // false when no install config exists yet, or install_root is unknown
}

message RunOnStartupResponse {
  bool run_on_startup = 1;
  bool known = 2;
}

message SetRunOnStartupRequest {
  string install_root = 1;
  bool run_on_startup = 2;
}

message DetectHardwareRequest {
  repeated string extra_report_search_paths = 1;  // §5.3 — additional CPU-Z/HWiNFO candidate dirs
}

message GpuInfoMessage {
  string name = 1;
  string vendor = 2;
  bool discrete = 3;
  optional float vram_gb = 4;       // absent, never a guessed number (§5.2)
  string compute_api = 5;
  optional int32 shader_core_count = 6;  // §5.3 — only set when an external report contributed
}

message HardwareProfileResponse {
  string cpu_name = 1;
  int32 cores = 2;
  int32 threads = 3;
  optional int32 ram_gb = 4;
  repeated GpuInfoMessage gpus = 5;
  repeated string npus = 6;
  string detected_at = 7;   // RFC 3339 — this project's one wire-format convention for timestamps
  string source = 8;        // "os_probe" | "os_probe+external_report" (§5.3)
}

// One answer to one previously-issued `WizardStepMessage`. The very first message a client
// sends has `step_id = "welcome"` and `data["use_case"]` set — `WizardEngine.run()`'s own first
// `yield` requires no prior answer, but the wire protocol still needs a first client message to
// open the bidirectional stream, so the client sends its `WELCOME` answer as that first message
// rather than the server needing a distinct "start" RPC.
message WizardAnswerMessage {
  string step_id = 1;
  bool skipped = 2;
  map<string, string> data = 3;   // values are opaque strings; a client that needs a richer
                                    // shape (credentials, proration choices) JSON-encodes it,
                                    // the same convention FrozenDict's own wire mapping uses
                                    // elsewhere in this project's proto surfaces
}

message WizardStepMessage {
  string step_id = 1;
  map<string, string> context = 2;   // e.g. HARDWARE_TIER's recommended_tier/reasoned pair
  bool is_final = 3;                 // true only for the FINALIZE step's own message
}

message ProvisionVenvsRequest {
  string clone_dir = 1;
  optional string python_bin = 2;
}

message ProvisionOutcomeMessage {
  string import_path = 1;
  string venv_dir = 2;
  bool created = 3;
  string error_code = 4;    // empty string = no error
  string error_detail = 5;
}

message ProvisionVenvsResponse {
  repeated ProvisionOutcomeMessage outcomes = 1;
  bool fully_provisioned = 2;
}
