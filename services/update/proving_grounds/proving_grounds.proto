// Proving Grounds gRPC surface (`v3-deepdive-36-proving-grounds.md` §6).
//
// Field-numbering discipline (`docs/templates/new_grpc_endpoint.md`): fields are only ever
// added, never removed or renumbered.
//
// Errors are data (`docs/PRINCIPLES.md` §4.1): every response carries an
// `error_code`/`error_detail` pair.

syntax = "proto3";

package resibo.proving_grounds.v1;

service ProvingGroundsService {
  rpc TestCandidate(TestCandidateRequest) returns (TestResultResponse);
  rpc GetTestHistory(HistoryRequest) returns (TestHistoryResponse);
}

message TestCandidateRequest {
  string kind = 1;              // "dependency_bump" | "code_release"
  string name = 2;
  string version = 3;
  string affected_api = 4;
  string download_url = 5;
  string hf_token = 6;
  string requested_by = 7;
}

message TestResultInfo {
  string candidate_name = 1;
  string candidate_version = 2;
  string affected_api = 3;
  bool passed = 4;
  string started_at = 5;        // RFC 3339
  string finished_at = 6;       // RFC 3339
  string bench_summary = 7;
  string error_code = 8;
  string error_detail = 9;
}

message TestResultResponse {
  TestResultInfo result = 1;
  string error_code = 2;
  string error_detail = 3;
}

message HistoryRequest {
  string affected_api = 1;      // empty means every affected_api
  int32 limit = 2;              // 0 defers to the server default
}

message TestHistoryResponse {
  repeated TestResultInfo results = 1;
  string error_code = 2;
  string error_detail = 3;
}
