// temporal_learning gRPC surface (`v3-deepdive-40-temporal-learning.md` §10).
//
// Field-numbering discipline (`docs/templates/new_grpc_endpoint.md`): fields are only ever
// added, never removed or renumbered.
//
// Errors are data, not status codes (`docs/PRINCIPLES.md` §4.1): every response carries an
// `error_code`/`error_detail` pair, matching `contracts.LearningError`'s two fields. Three
// codes exist specifically so a refused shortcut is legible rather than silent —
// `not_shared`, `prescreen_required`, `approval_required`.

syntax = "proto3";

package resibo.architect.temporal_learning.v1;

service TemporalLearningService {
  // Always creates LOCAL + unshared. A staff caller wanting a GLOBAL entity uses
  // SubmitContribution with the staff path (§3.2) — there is deliberately no flag here
  // that produces a global entity, so no caller can reach that layer through this RPC.
  rpc CreateEntity(CreateEntityRequest) returns (EntityResponse);
  rpc UpdateEntity(UpdateEntityRequest) returns (EntityResponse);

  // §3.1's explicit consent step. The only thing that makes a LOCAL fact eligible for
  // GLOBAL review at all. Never invoked by the learning pipeline on its own behalf.
  rpc ShareEntity(ShareEntityRequest) returns (ContributionResponse);

  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);
  rpc SubmitContribution(ContributionRequest) returns (ContributionResponse);
  rpc ReviewContribution(ReviewRequest) returns (ContributionResponse);
  rpc GetCategoryDefaults(CategoryRequest) returns (CategoryDefaultsResponse);
  rpc ListCurationCandidates(CurationListRequest) returns (CurationListResponse);
  // Routes through the same review pipeline a new contribution takes — Curate gets no
  // shortcut for being "only cleanup" (§7).
  rpc ResolveCurationCandidate(ResolveCurationRequest) returns (ContributionResponse);
}

message CorporationInfo {
  string corporation_id = 1;
  string name = 2;
  string corporate_tin = 3;       // the parent corporation's own TIN
  string layer = 4;               // "local" | "global"
  bool shared = 5;
  string owner_user_id = 6;
  string category_code = 7;
  string created_at = 8;          // RFC 3339
}

message FranchiserInfo {
  string franchiser_id = 1;
  string name = 2;
  // The local operator's own TIN, genuinely distinct from a corporation's. This entity is
  // standalone and referenced by branches, never embedded in them (§4).
  string franchiser_tin = 3;
  string layer = 4;
  bool shared = 5;
  string owner_user_id = 6;
  string created_at = 7;
}

message BranchInfo {
  string branch_id = 1;
  string corporation_id = 2;
  string address = 3;
  // A reference into the franchiser list. Empty is a legitimate, permanent end state for a
  // corporate-owned branch — not "not filled in yet" (§12, resolved).
  string franchiser_id = 4;
  string layer = 5;
  bool shared = 6;
  string owner_user_id = 7;
  string created_at = 8;
}

message EntityInfo {
  string entity_type = 1;         // corporation | branch | franchiser
  CorporationInfo corporation = 2;
  FranchiserInfo franchiser = 3;
  BranchInfo branch = 4;
}

message CreateEntityRequest {
  string entity_type = 1;
  map<string, string> fields = 2;
  string actor_user_id = 3;
}

message UpdateEntityRequest {
  string entity_type = 1;
  string entity_id = 2;
  map<string, string> changes = 3;
  string actor_user_id = 4;
}

message EntityResponse {
  EntityInfo entity = 1;
  string error_code = 2;
  string error_detail = 3;
}

message ShareEntityRequest {
  string entity_type = 1;
  string entity_id = 2;
  string requesting_user_id = 3;
}

message ListEntitiesRequest {
  string entity_type = 1;
  // Resolved server-side from the session. LOCAL entities are returned only to their own
  // owner; the filter is applied on read, never left to the caller.
  string user_id = 2;
  string query = 3;
  int32 limit = 4;
}

message ListEntitiesResponse {
  repeated EntityInfo entities = 1;
  string error_code = 2;
  string error_detail = 3;
}

message ContributionInfo {
  string contribution_id = 1;
  string contributor = 2;
  string target_entity_type = 3;
  string target_entity_id = 4;
  map<string, string> proposed_change = 5;
  string target_layer = 6;
  string llm_prescreen_verdict = 7;
  string staff_review_status = 8;
  bool merged = 9;
  string submitted_at = 10;
  string curation_type = 11;
}

message ContributionRequest {
  string contributor = 1;
  string target_entity_type = 2;
  string target_entity_id = 3;
  map<string, string> proposed_change = 4;
  bool staff_authored = 5;        // server-resolved from the session's role, never claimed
}

message ContributionResponse {
  ContributionInfo contribution = 1;
  string error_code = 2;
  string error_detail = 3;
}

message ReviewRequest {
  string contribution_id = 1;
  string reviewer = 2;
  bool approved = 3;
  string reason = 4;
}

message CategoryRequest {
  string category = 1;
}

message CategoryDefaultInfo {
  string category = 1;
  string field_name = 2;
  map<string, string> default_value = 3;
  // Derived from how many confirmed GLOBAL vendors in the category agree, not asserted.
  double confidence = 4;
  int32 sample_size = 5;
}

message CategoryDefaultsResponse {
  repeated CategoryDefaultInfo defaults = 1;
  string error_code = 2;
  string error_detail = 3;
}

message CurationListRequest {
  string candidate_type = 1;      // empty means every type
  int32 limit = 2;
}

message CurationCandidateInfo {
  string candidate_type = 1;      // low_confidence_stale | near_duplicate_merge | abandoned_pending_review
  repeated string target_entries = 2;   // one for stale/abandoned, two or more for a merge
  string reasoning = 3;
  string entity_type = 4;
}

message CurationListResponse {
  repeated CurationCandidateInfo candidates = 1;
  string error_code = 2;
  string error_detail = 3;
}

message ResolveCurationRequest {
  string candidate_type = 1;
  repeated string target_entries = 2;
  string requesting_user_id = 3;
}
